monitor=,preferred,auto,1.25

# Slow app launch fix
# The actual autostart lies at the end, not here.
exec-once = systemctl --user import-environment &
exec-once = hash dbus-update-activation-environment 2>/dev/null &
exec-once = dbus-update-activation-environment --systemd &
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd HYPRLAND_INSTANCE_SIGNATURE
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment QT_QPA_PLATFORMTHEME

#------------#
#  Hyprland  #
#------------#
xwayland {
  force_zero_scaling = true
}

input {
    follow_mouse = 2 # 0|1|2|3
    float_switch_override_focus = 0

    touchpad {
        natural_scroll = true
    }

    accel_profile = flat
    sensitivity = 0
}

general {
    gaps_in = 3
    gaps_out = 5
    border_size = 3
    col.active_border = rgba(ff5e81ac)
    layout = dwindle # master|dwindle
}

decoration {
    fullscreen_opacity = 1.0

    rounding = 4

    blur {
        enabled = true
        size = 5
        passes = 1 # more passes = more resource intensive.
        new_optimizations = true
        xray = true
        ignore_opacity = false
    }

    drop_shadow = false
    dim_inactive = false

    col.shadow = rgba(1a1a1aee)
}

animations {
    enabled = yes

    bezier = overshot, 0.13, 0.99, 0.29, 1.1
    animation = windows, 1, 4, overshot, slide
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 5, default
    animation = fade, 1, 8, default
    animation = workspaces, 1, 6, overshot
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    no_gaps_when_only = false
    force_split = 0
    special_scale_factor = 0.8
    split_width_multiplier = 1.0
    use_active_for_splits = true
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    no_gaps_when_only = false
    new_status = master
    special_scale_factor = 0.8
}

cursor {
    no_hardware_cursors = true
    no_break_fs_vrr = true
    min_refresh_rate = 48
}

misc {
    #disable_autoreload = true
    disable_hyprland_logo = true
    always_follow_on_dnd = true
    layers_hog_keyboard_focus = true
    animate_manual_resizes = false
    enable_swallow = true
    swallow_regex =
    focus_on_activate = true
    vfr = 1

    initial_workspace_tracking = 2
    middle_click_paste = false

    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

gestures {
     workspace_swipe = true
     workspace_swipe_fingers = 4
     workspace_swipe_distance = 250
     workspace_swipe_invert = true
     workspace_swipe_min_speed_to_force = 15
     workspace_swipe_cancel_ratio = 0.5
     workspace_swipe_create_new = false
}

binds {
     workspace_back_and_forth = false
     allow_workspace_cycles = 1
}

#------------#
# keybinding #
#------------#
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $TERM
bind = $mainMod, Q, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, rofi -show drun
bind = $mainMod, F, fullscreen
bind = $mainMod, J, togglesplit, # dwindle

# Volume control
bind=,XF86AudioLowerVolume,exec,pamixer -ud 3 && pamixer --get-volume > /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob
bind=,XF86AudioRaiseVolume,exec,pamixer -ui 3 && pamixer --get-volume > /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob
bind=,XF86AudioMute,exec,amixer set Master toggle | sed -En '/\[on\]/ s/.*\[([0-9]+)%\].*/\1/ p; /\[off\]/ s/.*/0/p' | head -1 > /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob

# Playback control
bind=,XF86AudioPlay,exec, playerctl play-pause
bind=,XF86AudioNext,exec, playerctl next
bind=,XF86AudioPrev,exec, playerctl previous

# Screen brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# Screen lock
bind = $mainMod, L, exec, hyprlock

# Restart waybar
bind = $mainMod, O, exec, killall -SIGUSR2 waybar

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, bracketright, workspace, e+1
bind = $mainMod, bracketleft, workspace, e-1

# move windows around
bind = $mainMod SHIFT,left ,movewindow, l
bind = $mainMod SHIFT,right ,movewindow, r
bind = $mainMod SHIFT,up ,movewindow, u
bind = $mainMod SHIFT,down ,movewindow, d

# Move active window to a workspace with mainMod + CTRL + [0-9]
bind = $mainMod CTRL, 1, movetoworkspace, 1
bind = $mainMod CTRL, 2, movetoworkspace, 2
bind = $mainMod CTRL, 3, movetoworkspace, 3
bind = $mainMod CTRL, 4, movetoworkspace, 4
bind = $mainMod CTRL, 5, movetoworkspace, 5
bind = $mainMod CTRL, 6, movetoworkspace, 6
bind = $mainMod CTRL, 7, movetoworkspace, 7
bind = $mainMod CTRL, 8, movetoworkspace, 8
bind = $mainMod CTRL, 9, movetoworkspace, 9
bind = $mainMod CTRL, 0, movetoworkspace, 10

# same as above, but doesnt switch to the workspace
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Resize windows
bind=CTRL SHIFT, l, resizeactive, 15 0
bind=CTRL SHIFT, j, resizeactive,-15 0
bind=CTRL SHIFT, i, resizeactive, 0 -15
bind=CTRL SHIFT, k, resizeactive, 0 15

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshotting
bind = $mainMod, PRINT, exec, hyprshot -m window --clipboard-only
bind = , PRINT, exec, hyprshot -m output -m active -z --clipboard-only
bind = $mainMod SHIFT, PRINT, exec, hyprshot -m region -z --clipboard-only
bind = $mainMod SHIFT, S, exec, hyprshot -m region -z --clipboard-only

# Alt Tabbing
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,
bind = ALT SHIFT, Tab, cyclenext, prev

# Clipboard
bind = $mainMod SHIFT, V, exec, nwg-clipman

# Emoji picker
bind = $mainMod, period, exec, rofimoji -a type copy

# Nightlight
bind = ALT, End, exec, hyprshade toggle blue-light-filter

# Color picker
bind = $mainMod ALT, P, exec, hyprpicker --autocopy

# Battery mode
bind = ALT,         B, exec, ~/.config/hypr/scripts/i_love_my_battery.sh
bind = ALT SHIFT,   B, exec, ~/.config/hypr/scripts/i_hate_my_battery.sh

#------------#
# auto start #
#------------#
exec = hyprshade auto
exec-once = dex -a
exec-once = spoofdpi -dns-addr 9.9.9.11 -port 8011 -enable-doh &
exec-once = hypridle &
exec-once = hyprpaper &
exec-once = waybar &
exec-once = mako &
exec-once = bash -c "mkfifo /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob && tail -f /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob | wob & disown" &
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = eww daemon

#---------------#
# windows rules #
#---------------#
windowrulev2 = float        ,title:^(Picture-in-Picture)$
windowrulev2 = float        ,class:^(electron)$,title:^(Open Files)$
windowrulev2 = float        ,class:^(xdg-desktop-portal-gtk)$
windowrulev2 = float        ,class:^(xdg-desktop-portal-hyprland)$
windowrulev2 = float        ,class:^(polkit-gnome-authentication-agent-1)$
windowrulev2 = float        ,class:^(nm-connection-editor)$
windowrulev2 = float        ,class:^(org.gnome.Nautilus)$
windowrulev2 = size 1398 793,class:^(org.gnome.Nautilus)$
windowrulev2 = float        ,class:^(.*)(pavucontrol)$
windowrulev2 = float        ,class:^(jetbrains)(.*)$,title:^(Welcome)(.*)$
windowrulev2 = size 1020 650,class:^(jetbrains)(.*)$,title:^(Welcome)(.*)$
windowrulev2 = float        ,class:^(org.fcitx.fcitx5-config)(.*)$
windowrulev2 = size 1020 770,class:^(org.fcitx.fcitx5-config)(.*)$
windowrulev2 = float        ,class:^(org.gnome.FileRoller)$
windowrulev2 = float        ,class:^(org.gnome.seahorse.Application)$

#---------------#
# env variables #
#---------------#
# Input method
env = QT_IM_MODULE,fcitx
env = SDL_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx

# wayland render
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = ECORE_EVAS_ENGINE,wayland_egl
env = ELM_ENGINE,wayland_egl
env = BEMENU_BACKEND,wayland
env = _JAVA_AWT_WM_NONREPARENTING,1
env = MOZ_DBUS_REMOTE,1
env = MOZ_ENABLE_WAYLAND,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

# XDG stuffs
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# theme(?) stuffs
env = GTK_THEME,catppuccin-mocha-flamingo-standard+default
env = HYPRCURSOR_THEME,catppuccin-mocha-flamingo-cursors
env = HYPRCURSOR_SIZE,32
env = XCURSOR_THEME,catppuccin-mocha-flamingo-cursors
env = XCURSOR_SIZE,32
env = QT_QPA_PLATFORMTHEME,qt5ct

# Random stuffs
env = TERM,alacritty
env = EDITOR,nano
